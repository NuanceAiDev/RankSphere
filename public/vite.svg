<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Smooth rounded background -->
  <rect width="100" height="100" rx="22" fill="url(#bg-grad)" />
  
  <!-- SEO Growth Arrow & Chart -->
  <path d="M28 72 L45 52 L58 62 L78 32" stroke="url(#line-grad)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Arrow Head -->
  <polyline points="62,32 78,32 78,48" stroke="url(#line-grad)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Decorative Grid Dots -->
  <circle cx="28" cy="72" r="4" fill="#ffffff" />
  <circle cx="45" cy="52" r="4" fill="#ffffff" />
  <circle cx="58" cy="62" r="4" fill="#ffffff" />
</svg>
